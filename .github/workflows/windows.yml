name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-bash:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and self-test macOS Bash script
        run: |
          bash -n ./claude-watch.sh
          bash ./claude-watch.sh --self-test

  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Windows PowerShell 5.1 self-test (claude-watch)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\claude-watch.ps1 -SelfTest

      - name: Run Windows PowerShell 5.1 self-test (code-watch)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\code-watch.ps1 -SelfTest
